services:
  quest:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        POCKETBASE_VERSION: "0.26.3"
    container_name: quest
    restart: unless-stopped
    environment:
      ENCRYPTION: ""
      POCKETBASE_ADMIN_EMAIL: "admin@quest.local"
      POCKETBASE_ADMIN_PASSWORD: "jazqob-haqzEs-tiksy1"
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./pb_data:/pb_data
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8090/api/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 5
